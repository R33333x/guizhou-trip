 return `<li class="todo-item${done?' done':''}${overdue&&!done?' overdue':''}"><label class="check-area" for="todo-${t.id}"><input type="checkbox" id="todo-${t.id}" data-todo="${t.id}" ${done?'checked':''}></label><div class="todo-body"><label class="todo-text" for="todo-${t.id}">${esc(t.text)}</label><span class="due">${date(t.due)} 截止${done?' · 已完成':overdue?' · 已逾期':''}</span></div></li>`;
 }).join('');
 $('todo-progress').textContent=`${TODOS.filter(t=>checked[t.id]===true).length} / ${TODOS.length} 已完成`;
 if(!storageAvailable)$('storage-hint').textContent='当前浏览器无法保存状态，勾选仅本次打开有效。';
}
function endOf(e){
 if(e.endTime)return new Date(e.endTime).getTime();
 if(e.duration)return new Date(e.time).getTime()+e.duration*60000;
 const next=EVENTS.filter(n=>n.time>e.time&&(!e.route||!n.route||n.route===e.route)).sort((a,b)=>a.time.localeCompare(b.time))[0];
 return next?new Date(next.time).getTime():new Date(TRIP.end).getTime();
}
function remaining(ms){const s=Math.max(0,Math.ceil(ms/1000)),days=Math.floor(s/86400),hours=Math.floor(s%86400/3600),minutes=Math.floor(s%3600/60),seconds=s%60,pad=n=>String(n).padStart(2,'0');return ms>86400000?`${days} 天 ${pad(hours)}:${pad(minutes)}`:`${pad(Math.floor(s/3600))}:${pad(minutes)}:${pad(seconds)}`;}
function focusState(now){
 if(now>=new Date(TRIP.end).getTime())return {key:'ended',title:'行程已结束',counter:'山水有期',info:'下次，再一起出发。'};
 const ordered=EVENTS.slice().sort((a,b)=>a.time.localeCompare(b.time));
 const current=ordered.filter(e=>new Date(e.time).getTime()<=now&&endOf(e)>now);
 if(current.length){const first=current[0],parallel=current.filter(e=>e.day===first.day&&e.route);if(parallel.length>1)return {key:'parallel-'+parallel.map(e=>e.id).join('-'),title:'A / B 两线进行中',counter:remaining(Math.min(...parallel.map(endOf))-now),info:parallel.map(e=>`${e.title} · ${time(e.time)}`).join('；')+' · 距下一线结束',place:first.place,state:'进行中',event:first};return {key:first.id,title:first.title,counter:remaining(endOf(first)-now),info:`${date(first.time)} ${time(first.time)} 开始 · 距本节点结束`,place:first.place,state:'进行中',event:first};}
 const next=ordered.find(e=>new Date(e.time).getTime()>now);
 if(next){const others=ordered.filter(e=>e.time===next.time&&e.route);return {key:'next-'+next.id,title:others.length>1?'A / B 两线出发':next.title,counter:remaining(new Date(next.time).getTime()-now),info:`${date(next.time)} ${time(next.time)} 开始 · 距离出发`,place:next.place,state:'下一站',event:next};}
 return {key:'arrived',title:'返程已抵达',counter:'节点已完成',info:'愿这一路的好心情，陪你回到日常。'};
}
let focusKey='',lastDate='';
function tick(now=Date.now()){
 const s=focusState(now);$('focus-title').textContent=s.title;$('focus-state').textContent=s.state||'';$('countdown').textContent=s.counter;$('focus-info').textContent=s.info;
 $('countdown').setAttribute('aria-label',s.state==='进行中'?'本节点剩余时间':'距离下一节点');
 if(s.key!==focusKey){$('focus-place').innerHTML=s.place?placeUI(s.place,{time:s.event.time,label:s.event.placeLabel}):'';focusKey=s.key;}
 const today=new Date(now+8*3600000).toISOString().slice(0,10);if(today!==lastDate){renderTodos(now);lastDate=today;}
}
const themeLabels={auto:'跟随系统',light:'浅色',dark:'深色'};
function setTheme(value,persist=false){const theme=Object.hasOwnProperty.call(themeLabels,value)?value:'auto';document.documentElement.dataset.theme=theme;$('theme-toggle').innerHTML=icon('sun')+`<span>${themeLabels[theme]}</span>`;$('theme-toggle').setAttribute('aria-label',`当前${themeLabels[theme]}，点击切换主题`);if(persist&&!writeStorage('guizhou-theme',theme))toast('主题已切换，当前浏览器无法保存偏好');}
let toastTimer;
function toast(message){clearTimeout(toastTimer);$('toast').textContent=message;toastTimer=setTimeout(()=>$('toast').textContent='',2500);}
function fallbackCopy(value){const area=document.createElement('textarea');area.value=value;area.setAttribute('readonly','');area.style.cssText='position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;';document.body.appendChild(area);const prior=document.activeElement;area.focus();area.select();area.setSelectionRange(0,area.value.length);let ok=false;try{ok=document.execCommand('copy');}catch(e){}area.remove();if(prior&&prior.focus)prior.focus({preventScroll:true});return ok;}
async function copy(value,button){let ok=false;try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(value);ok=true;}}catch(e){}if(!ok)ok=fallbackCopy(value);if(ok){button.textContent='已复制';clearTimeout(button._copyTimer);button._copyTimer=setTimeout(()=>button.textContent='复制地址',1500);toast('地址已复制');}else toast('复制失败，请长按选择');}
function jump(day){const section=$('day-'+day);if(!section)return;document.querySelectorAll('.day.is-highlighted').forEach(el=>el.classList.remove('is-highlighted'));section.classList.add('is-highlighted');section.scrollIntoView({block:'start',behavior:'auto'});history.replaceState(null,'','#day-'+day);clearTimeout(jump.timer);jump.timer=setTimeout(()=>section.classList.remove('is-highlighted'),1800);}
document.addEventListener('click',event=>{
 const toggle=event.target.closest('.place-toggle');if(toggle){const open=toggle.getAttribute('aria-expanded')==='true';toggle.setAttribute('aria-expanded',String(!open));$(toggle.getAttribute('aria-controls')).hidden=open;return;}
 const copyButton=event.target.closest('[data-copy]');if(copyButton){copy(copyButton.dataset.copy,copyButton);return;}
 const mapNode=event.target.closest('[data-map-day]');if(mapNode){jump(mapNode.dataset.mapDay);return;}
 const dayLink=event.target.closest('.nav a');if(dayLink){event.preventDefault();jump(dayLink.hash.slice(-1));}
});
document.addEventListener('keydown',event=>{const node=event.target.closest('[data-map-day]');if(node&&(event.key==='Enter'||event.key===' ')){event.preventDefault();jump(node.dataset.mapDay);}});
$('todos').addEventListener('change',event=>{const input=event.target;if(!input.matches('[data-todo]'))return;checked[input.dataset.todo]=input.checked;if(!writeStorage('guizhou-todos-v1',JSON.stringify(checked)))toast('当前浏览器无法保存，勾选仅本次有效');const key=input.id;renderTodos();$(key).focus({preventScroll:true});});
$('theme-toggle').addEventListener('click',()=>{const values=['auto','light','dark'];setTheme(values[(values.indexOf(document.documentElement.dataset.theme)+1)%values.length],true);});
renderHeader();renderMap();renderConfirmed();renderDays();renderTodos();$('tips').innerHTML=TIPS.map((t,i)=>`<article class="card tip"><span class="tip-index">NOTE / ${String(i+1).padStart(2,'0')}</span><h3>${esc(t.title)}</h3><p>${esc(t.body)}</p></article>`).join('');setTheme(readStorage('guizhou-theme','auto'));tick();setInterval(()=>tick(),1000);
</script>
</body>
